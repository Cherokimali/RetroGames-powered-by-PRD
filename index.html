<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>MAISUG/DDS VS LOSERS</title>
<meta property="og:type" content="website">
<meta property="og:title" content="MAISUG/DDS VS LOSERS">
<meta property="og:description" content="Play now — retro Atari-style space shooter. Rotate, thrust, and blast your way through the asteroid waves!">
<meta property="og:image" content="https://cherokimali.github.io/RetroGames-powered-by-PRD/thumbnail.png">
<meta property="og:url" content="https://cherokimali.github.io/RetroGames-powered-by-PRD/">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="MAISUG/DDS VS LOSERS">
<meta name="twitter:description" content="Play now — retro Atari-style space shooter.">
<meta name="twitter:image" content="https://cherokimali.github.io/RetroGames-powered-by-PRD/thumbnail.png">
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: #0a0a0a;
    height: 100%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Courier New', monospace;
    overflow: hidden;
    touch-action: none;
  }
  #wrap {
    text-align: center;
    width: 100%;
    max-width: 640px;
    padding: 0 8px;
    box-sizing: border-box;
  }
  h1 {
    color: #39ff14;
    letter-spacing: 2px;
    font-size: 18px;
    margin: 0 0 10px 0;
    text-shadow: 0 0 10px #39ff14;
  }
  #hud {
    display: flex;
    justify-content: space-between;
    width: 100%;
    max-width: 640px;
    margin: 0 auto 8px auto;
    color: #0ff;
    font-size: 16px;
    letter-spacing: 2px;
    text-shadow: 0 0 6px #0ff;
  }
  #canvasWrap {
    position: relative;
    width: 100%;
    max-width: 640px;
    margin: 0 auto;
  }
  canvas {
    background: #000;
    border: 3px solid #444;
    box-shadow: 0 0 30px rgba(57,255,20,0.25), inset 0 0 40px rgba(0,255,255,0.05);
    display: block;
    width: 100%;
    height: auto;
  }
  #msg {
    color: #fff;
    margin-top: 10px;
    font-size: 14px;
    letter-spacing: 2px;
    min-height: 20px;
  }
  #msg span {
    color: #39ff14;
    cursor: pointer;
    text-decoration: underline;
  }
  #touchControls {
    display: none;
    justify-content: space-between;
    align-items: flex-end;
    width: 100%;
    max-width: 640px;
    margin: 14px auto 0 auto;
    user-select: none;
    -webkit-user-select: none;
  }
  #touchControls.active { display: flex; }
  .touchGroup {
    display: flex;
    gap: 10px;
  }
  .touchBtn {
    width: 60px;
    height: 60px;
    border-radius: 50%;
    background: rgba(57,255,20,0.08);
    border: 2px solid #39ff14;
    color: #39ff14;
    font-size: 22px;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 0 12px rgba(57,255,20,0.3);
    -webkit-tap-highlight-color: transparent;
  }
  .touchBtn:active, .touchBtn.pressed {
    background: rgba(57,255,20,0.35);
  }
  #fireBtn {
    width: 76px;
    height: 76px;
    border-color: #ff6b00;
    color: #ff6b00;
    box-shadow: 0 0 12px rgba(255,107,0,0.35);
    font-size: 14px;
  }
  #fireBtn:active, #fireBtn.pressed {
    background: rgba(255,107,0,0.35);
  }
  @media (max-width: 480px) {
    h1 { font-size: 14px; }
    #hud { font-size: 13px; }
    #msg { font-size: 12px; }
  }
</style>
</head>
<body>
<div id="wrap">
  <h1>&#9608; MAISUG/DDS VS LOSERS &#9608;</h1>
  <div id="hud">
    <div>SCORE: <span id="score">0</span></div>
    <div>LIVES: <span id="lives">3</span></div>
    <div>WAVE: <span id="level">1</span></div>
  </div>
  <div id="canvasWrap">
    <canvas id="game" width="640" height="480"></canvas>
  </div>
  <div id="msg">&larr; &rarr; ROTATE &nbsp;|&nbsp; &uarr; THRUST &nbsp;|&nbsp; SPACE TO FIRE</div>
  <div id="touchControls">
    <div class="touchGroup">
      <div class="touchBtn" id="leftBtn">&#9664;</div>
      <div class="touchBtn" id="rightBtn">&#9654;</div>
      <div class="touchBtn" id="thrustBtn">&#9650;</div>
    </div>
    <div class="touchBtn" id="fireBtn">FIRE</div>
  </div>
</div>
 
<script>
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
const W = canvas.width, H = canvas.height;
 
const scoreEl = document.getElementById('score');
const livesEl = document.getElementById('lives');
const levelEl = document.getElementById('level');
const msgEl = document.getElementById('msg');
 
let score = 0, lives = 3, wave = 1, running = true;
 
// ---- Sound engine (Web Audio API, no external files) ----
let audioCtx = null;
function getAudioCtx() {
  if (!audioCtx) {
    audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  }
  if (audioCtx.state === 'suspended') audioCtx.resume();
  return audioCtx;
}
 
function playFireSound() {
  const ac = getAudioCtx();
  const osc = ac.createOscillator();
  const gain = ac.createGain();
  osc.type = 'square';
  osc.frequency.setValueAtTime(900, ac.currentTime);
  osc.frequency.exponentialRampToValueAtTime(200, ac.currentTime + 0.12);
  gain.gain.setValueAtTime(0.08, ac.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.12);
  osc.connect(gain).connect(ac.destination);
  osc.start();
  osc.stop(ac.currentTime + 0.13);
}
 
function playExplosionSound(big=false) {
  const ac = getAudioCtx();
  const bufferSize = ac.sampleRate * (big ? 0.4 : 0.2);
  const buffer = ac.createBuffer(1, bufferSize, ac.sampleRate);
  const data = buffer.getChannelData(0);
  for (let i = 0; i < bufferSize; i++) {
    data[i] = (Math.random() * 2 - 1) * (1 - i / bufferSize);
  }
  const noise = ac.createBufferSource();
  noise.buffer = buffer;
  const filter = ac.createBiquadFilter();
  filter.type = 'lowpass';
  filter.frequency.setValueAtTime(big ? 900 : 1500, ac.currentTime);
  filter.frequency.exponentialRampToValueAtTime(80, ac.currentTime + (big ? 0.4 : 0.2));
  const gain = ac.createGain();
  gain.gain.setValueAtTime(big ? 0.35 : 0.2, ac.currentTime);
  gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + (big ? 0.4 : 0.2));
  noise.connect(filter).connect(gain).connect(ac.destination);
  noise.start();
}
 
let thrustOsc = null, thrustGain = null;
function startThrustSound() {
  if (thrustOsc) return;
  const ac = getAudioCtx();
  thrustOsc = ac.createOscillator();
  thrustGain = ac.createGain();
  thrustOsc.type = 'sawtooth';
  thrustOsc.frequency.setValueAtTime(70, ac.currentTime);
  thrustGain.gain.setValueAtTime(0.05, ac.currentTime);
  thrustOsc.connect(thrustGain).connect(ac.destination);
  thrustOsc.start();
}
function stopThrustSound() {
  if (!thrustOsc) return;
  const ac = getAudioCtx();
  thrustGain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + 0.08);
  thrustOsc.stop(ac.currentTime + 0.1);
  thrustOsc = null;
  thrustGain = null;
}
 
function playJingle(type) {
  const ac = getAudioCtx();
  const notesUp = [392, 523.25, 659.25, 783.99];   // wave clear: rising
  const notesDown = [392, 329.63, 261.63, 196];     // game over: falling
  const notes = type === 'win' ? notesUp : notesDown;
  notes.forEach((freq, i) => {
    const osc = ac.createOscillator();
    const gain = ac.createGain();
    osc.type = 'triangle';
    osc.frequency.setValueAtTime(freq, ac.currentTime + i * 0.12);
    gain.gain.setValueAtTime(0.001, ac.currentTime + i * 0.12);
    gain.gain.linearRampToValueAtTime(0.12, ac.currentTime + i * 0.12 + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.001, ac.currentTime + i * 0.12 + 0.18);
    osc.connect(gain).connect(ac.destination);
    osc.start(ac.currentTime + i * 0.12);
    osc.stop(ac.currentTime + i * 0.12 + 0.2);
  });
}
 
// Ship
const ship = {
  x: W/2, y: H/2,
  angle: -Math.PI/2, // pointing up
  vx: 0, vy: 0,
  radius: 12,
  thrusting: false,
  invincible: 0
};
 
// Bullets
let bullets = [];
const BULLET_SPEED = 7;
const BULLET_LIFE = 60;
let fireCooldown = 0;
 
// Asteroids/enemies
let asteroids = [];
 
function spawnAsteroids(count, minSize=3) {
  for (let i = 0; i < count; i++) {
    let x, y;
    do {
      x = Math.random() * W;
      y = Math.random() * H;
    } while (Math.hypot(x - ship.x, y - ship.y) < 120);
    asteroids.push(makeAsteroid(x, y, minSize));
  }
}
 
function makeAsteroid(x, y, size) {
  const angle = Math.random() * Math.PI * 2;
  const speed = 0.5 + Math.random() * 1 + (wave * 0.1);
  const radius = size * 12;
  const verts = [];
  const numVerts = 8 + Math.floor(Math.random()*4);
  for (let i = 0; i < numVerts; i++) {
    const a = (i / numVerts) * Math.PI * 2;
    const r = radius * (0.8 + Math.random()*0.4);
    verts.push({a, r});
  }
  // craters for surface texture
  const craters = [];
  const numCraters = 3 + Math.floor(Math.random()*4);
  for (let i = 0; i < numCraters; i++) {
    craters.push({
      a: Math.random() * Math.PI * 2,
      dist: Math.random() * radius * 0.55,
      r: radius * (0.12 + Math.random()*0.18)
    });
  }
  return {
    x, y,
    vx: Math.cos(angle) * speed,
    vy: Math.sin(angle) * speed,
    size, radius,
    rot: 0,
    rotSpeed: (Math.random()-0.5) * 0.03,
    verts,
    craters
  };
}
 
function wrap(obj) {
  if (obj.x < -30) obj.x = W + 30;
  if (obj.x > W + 30) obj.x = -30;
  if (obj.y < -30) obj.y = H + 30;
  if (obj.y > H + 30) obj.y = -30;
}
 
// Controls
const keys = {};
document.addEventListener('keydown', e => {
  keys[e.code] = true;
  if (e.code === 'Space') e.preventDefault();
});
document.addEventListener('keyup', e => keys[e.code] = false);
 
// ---- Touch controls for mobile ----
function isTouchDevice() {
  return ('ontouchstart' in window) || navigator.maxTouchPoints > 0;
}
 
if (isTouchDevice()) {
  const touchControls = document.getElementById('touchControls');
  touchControls.classList.add('active');
  msgEl.textContent = 'TAP ▲ TO THRUST, ◀ ▶ TO ROTATE, FIRE TO SHOOT';
 
  function bindHold(el, keyCode) {
    const press = (e) => { e.preventDefault(); keys[keyCode] = true; el.classList.add('pressed'); };
    const release = (e) => { e.preventDefault(); keys[keyCode] = false; el.classList.remove('pressed'); };
    el.addEventListener('touchstart', press, { passive: false });
    el.addEventListener('touchend', release, { passive: false });
    el.addEventListener('touchcancel', release, { passive: false });
    // also support mouse for testing on touch-enabled laptops
    el.addEventListener('mousedown', press);
    el.addEventListener('mouseup', release);
    el.addEventListener('mouseleave', release);
  }
 
  bindHold(document.getElementById('leftBtn'), 'ArrowLeft');
  bindHold(document.getElementById('rightBtn'), 'ArrowRight');
  bindHold(document.getElementById('thrustBtn'), 'ArrowUp');
 
  const fireBtn = document.getElementById('fireBtn');
  const firePress = (e) => {
    e.preventDefault();
    keys['Space'] = true;
    fireBtn.classList.add('pressed');
    launchOnTouch();
  };
  const fireRelease = (e) => {
    e.preventDefault();
    keys['Space'] = false;
    fireBtn.classList.remove('pressed');
  };
  fireBtn.addEventListener('touchstart', firePress, { passive: false });
  fireBtn.addEventListener('touchend', fireRelease, { passive: false });
  fireBtn.addEventListener('touchcancel', fireRelease, { passive: false });
  fireBtn.addEventListener('mousedown', firePress);
  fireBtn.addEventListener('mouseup', fireRelease);
 
  // unlock audio on first touch anywhere (mobile browsers require a user gesture)
  document.body.addEventListener('touchstart', () => { getAudioCtx(); }, { once: true, passive: true });
}
 
function launchOnTouch() {
  // placeholder, real launch handled by restartGame/game state already via keys['Space']
}
 
function startWave() {
  asteroids = [];
  spawnAsteroids(3 + wave, 3);
  levelEl.textContent = wave;
}
startWave();
 
function resetShip() {
  ship.x = W/2; ship.y = H/2;
  ship.vx = 0; ship.vy = 0;
  ship.angle = -Math.PI/2;
  ship.invincible = 120;
}
 
function update() {
  if (!running) return;
 
  // Rotation
  if (keys['ArrowLeft']) ship.angle -= 0.06;
  if (keys['ArrowRight']) ship.angle += 0.06;
 
  // Thrust
  ship.thrusting = !!keys['ArrowUp'];
  if (ship.thrusting) {
    ship.vx += Math.cos(ship.angle) * 0.12;
    ship.vy += Math.sin(ship.angle) * 0.12;
    startThrustSound();
  } else {
    stopThrustSound();
  }
  // Friction
  ship.vx *= 0.99;
  ship.vy *= 0.99;
  // Speed cap
  const spd = Math.hypot(ship.vx, ship.vy);
  const maxSpd = 6;
  if (spd > maxSpd) {
    ship.vx = ship.vx / spd * maxSpd;
    ship.vy = ship.vy / spd * maxSpd;
  }
 
  ship.x += ship.vx;
  ship.y += ship.vy;
  wrap(ship);
 
  if (ship.invincible > 0) ship.invincible--;
 
  // Firing
  if (fireCooldown > 0) fireCooldown--;
  if (keys['Space'] && fireCooldown <= 0) {
    bullets.push({
      x: ship.x + Math.cos(ship.angle) * ship.radius,
      y: ship.y + Math.sin(ship.angle) * ship.radius,
      vx: Math.cos(ship.angle) * BULLET_SPEED + ship.vx,
      vy: Math.sin(ship.angle) * BULLET_SPEED + ship.vy,
      life: BULLET_LIFE
    });
    fireCooldown = 10;
    playFireSound();
  }
 
  // Update bullets
  bullets.forEach(b => {
    b.x += b.vx; b.y += b.vy; b.life--;
    wrap(b);
  });
  bullets = bullets.filter(b => b.life > 0);
 
  // Update asteroids
  asteroids.forEach(a => {
    a.x += a.vx; a.y += a.vy;
    a.rot += a.rotSpeed;
    wrap(a);
  });
 
  // Bullet-asteroid collisions
  const newAsteroids = [];
  for (const a of asteroids) {
    let hit = false;
    for (const b of bullets) {
      if (b.life <= 0) continue;
      if (Math.hypot(a.x - b.x, a.y - b.y) < a.radius) {
        hit = true;
        b.life = 0;
        score += (4 - a.size) * 20;
        scoreEl.textContent = score;
        playExplosionSound(a.size >= 3);
        if (a.size > 1) {
          newAsteroids.push(makeAsteroid(a.x, a.y, a.size - 1));
          newAsteroids.push(makeAsteroid(a.x, a.y, a.size - 1));
        }
        break;
      }
    }
    if (!hit) newAsteroids.push(a);
  }
  asteroids = newAsteroids;
  bullets = bullets.filter(b => b.life > 0);
 
  // Ship-asteroid collision
  if (ship.invincible <= 0) {
    for (const a of asteroids) {
      if (Math.hypot(a.x - ship.x, a.y - ship.y) < a.radius + ship.radius * 0.6) {
        lives--;
        livesEl.textContent = lives;
        playExplosionSound(true);
        if (lives <= 0) {
          running = false;
          stopThrustSound();
          playJingle('lose');
          msgEl.innerHTML = 'GAME OVER — SCORE: ' + score + ' &nbsp; <span onclick="restartGame()">CLICK TO RESTART</span>';
        } else {
          resetShip();
          msgEl.textContent = 'SHIP LOST — REGROUPING...';
        }
        break;
      }
    }
  }
 
  // Wave clear
  if (asteroids.length === 0) {
    wave++;
    startWave();
    playJingle('win');
    msgEl.textContent = 'WAVE ' + wave + ' INCOMING';
  }
}
 
function drawShip() {
  if (ship.invincible > 0 && Math.floor(ship.invincible / 6) % 2 === 0) return; // blink
  ctx.save();
  ctx.translate(ship.x, ship.y);
  ctx.rotate(ship.angle);
 
  // Engine flame (drawn first, behind hull)
  if (ship.thrusting) {
    const flameLen = 14 + Math.random()*10;
    const flameGrad = ctx.createLinearGradient(-8, 0, -8 - flameLen, 0);
    flameGrad.addColorStop(0, 'rgba(255,180,0,0.95)');
    flameGrad.addColorStop(0.5, 'rgba(255,90,0,0.7)');
    flameGrad.addColorStop(1, 'rgba(255,40,0,0)');
    ctx.fillStyle = flameGrad;
    ctx.shadowColor = '#ff6b00';
    ctx.shadowBlur = 14;
    ctx.beginPath();
    ctx.moveTo(-8, 4);
    ctx.lineTo(-8 - flameLen, 0);
    ctx.lineTo(-8, -4);
    ctx.closePath();
    ctx.fill();
  }
 
  // Hull body with metallic gradient
  const hullGrad = ctx.createLinearGradient(-10, -9, 14, 9);
  hullGrad.addColorStop(0, '#0a3d0a');
  hullGrad.addColorStop(0.5, '#39ff14');
  hullGrad.addColorStop(1, '#a8ffa0');
  ctx.fillStyle = hullGrad;
  ctx.strokeStyle = '#c8ffc0';
  ctx.lineWidth = 1.2;
  ctx.shadowColor = '#39ff14';
  ctx.shadowBlur = 10;
  ctx.beginPath();
  ctx.moveTo(15, 0);
  ctx.lineTo(-9, 9);
  ctx.lineTo(-4, 5);
  ctx.lineTo(-4, -5);
  ctx.lineTo(-9, -9);
  ctx.closePath();
  ctx.fill();
  ctx.stroke();
 
  // Wing struts (detail lines)
  ctx.strokeStyle = 'rgba(10,60,10,0.8)';
  ctx.lineWidth = 1;
  ctx.beginPath();
  ctx.moveTo(2, -2); ctx.lineTo(-6, -7);
  ctx.moveTo(2, 2); ctx.lineTo(-6, 7);
  ctx.stroke();
 
  // Cockpit dome
  const cockpitGrad = ctx.createRadialGradient(6, -1.5, 0.5, 6, 0, 4);
  cockpitGrad.addColorStop(0, '#e0ffff');
  cockpitGrad.addColorStop(1, '#0077aa');
  ctx.fillStyle = cockpitGrad;
  ctx.shadowBlur = 6;
  ctx.shadowColor = '#0ff';
  ctx.beginPath();
  ctx.ellipse(6, 0, 3.6, 2.4, 0, 0, Math.PI*2);
  ctx.fill();
 
  ctx.restore();
}
 
function drawAsteroid(a) {
  ctx.save();
  ctx.translate(a.x, a.y);
  ctx.rotate(a.rot);
 
  // Rocky body fill with radial shading (lit from upper-left)
  const bodyGrad = ctx.createRadialGradient(
    -a.radius*0.3, -a.radius*0.3, a.radius*0.1,
    0, 0, a.radius*1.1
  );
  bodyGrad.addColorStop(0, '#8a8a8a');
  bodyGrad.addColorStop(0.55, '#5c5c5c');
  bodyGrad.addColorStop(1, '#2a2a2a');
 
  ctx.beginPath();
  a.verts.forEach((v, i) => {
    const x = Math.cos(v.a) * v.r;
    const y = Math.sin(v.a) * v.r;
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  });
  ctx.closePath();
  ctx.fillStyle = bodyGrad;
  ctx.shadowColor = '#000';
  ctx.shadowBlur = 3;
  ctx.fill();
 
  ctx.strokeStyle = '#d8d8d8';
  ctx.lineWidth = 1.3;
  ctx.shadowColor = '#aaa';
  ctx.shadowBlur = 3;
  ctx.stroke();
 
  // Clip craters to the asteroid silhouette so texture stays inside the rock
  ctx.save();
  ctx.clip();
  ctx.shadowBlur = 0;
  a.craters.forEach(c => {
    const cx = Math.cos(c.a) * c.dist;
    const cy = Math.sin(c.a) * c.dist;
    const craterGrad = ctx.createRadialGradient(
      cx - c.r*0.3, cy - c.r*0.3, c.r*0.1,
      cx, cy, c.r
    );
    craterGrad.addColorStop(0, 'rgba(20,20,20,0.75)');
    craterGrad.addColorStop(0.7, 'rgba(40,40,40,0.45)');
    craterGrad.addColorStop(1, 'rgba(60,60,60,0)');
    ctx.fillStyle = craterGrad;
    ctx.beginPath();
    ctx.arc(cx, cy, c.r, 0, Math.PI*2);
    ctx.fill();
    // crater rim highlight
    ctx.strokeStyle = 'rgba(180,180,180,0.35)';
    ctx.lineWidth = 0.8;
    ctx.beginPath();
    ctx.arc(cx - c.r*0.15, cy - c.r*0.15, c.r*0.85, 0, Math.PI*2);
    ctx.stroke();
  });
  ctx.restore();
 
  ctx.restore();
}
 
function draw() {
  ctx.clearRect(0, 0, W, H);
 
  // Stars
  ctx.fillStyle = '#222';
  for (let i = 0; i < 40; i++) {
    const sx = (i * 97) % W;
    const sy = (i * 53) % H;
    ctx.fillRect(sx, sy, 1, 1);
  }
 
  drawShip();
  asteroids.forEach(drawAsteroid);
 
  ctx.fillStyle = '#fff';
  ctx.shadowColor = '#fff';
  ctx.shadowBlur = 6;
  bullets.forEach(b => {
    ctx.beginPath();
    ctx.arc(b.x, b.y, 2, 0, Math.PI*2);
    ctx.fill();
  });
  ctx.shadowBlur = 0;
}
 
function loop() {
  update();
  draw();
  requestAnimationFrame(loop);
}
 
function restartGame() {
  score = 0; lives = 3; wave = 1;
  scoreEl.textContent = score;
  livesEl.textContent = lives;
  stopThrustSound();
  resetShip();
  startWave();
  running = true;
  msgEl.textContent = '← → ROTATE | ↑ THRUST | SPACE TO FIRE';
}
window.restartGame = restartGame;
 
resetShip();
loop();
</script>
</body>
</html>
